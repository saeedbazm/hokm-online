<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حکم آنلاین</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🃏 حکم آنلاین</h1>

        <div id="login">
            <h2>ورود به بازی</h2>
            <input type="text" id="playerName" placeholder="نام خود را وارد کنید">
            <button onclick="startGame()">ورود</button>
        </div>

        <div id="game" style="display:none;">
            <h2>خوش آمدی <span id="name"></span> 👋</h2>
            <p>اتاق بازی آماده است.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
