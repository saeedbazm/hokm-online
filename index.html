<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حکم آنلاین</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#061b11,#0d4228);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:94%;
  max-width:500px;
  background:rgba(0,0,0,.38);
  border-radius:25px;
  padding:22px;
  text-align:center;
}

h1{margin:5px 0 15px}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  text-align:center;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:0;
  border-radius:12px;
  background:#d7ad45;
  font-size:17px;
  font-weight:bold;
}

.secondary{
  background:#174d32;
  color:white;
}

.hidden{display:none}

.room-code{
  font-size:30px;
  color:#ffd866;
  letter-spacing:5px;
  margin:12px;
}

.player{
  background:rgba(255,255,255,.08);
  padding:11px;
  margin:6px 0;
  border-radius:10px;
}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:15px;
}

.card{
  width:58px;
  height:78px;
  background:white;
  color:#111;
  border-radius:9px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
}

.red{color:#d22}

.status{
  margin:15px 0;
  color:#c5ddd1;
}
</style>
</head>

<body>

<div class="container">

<!-- صفحه اصلی -->
<div id="home">

<h1>🃏 حکم آنلاین</h1>

<input id="name" placeholder="نام بازیکن">

<button onclick="createRoom()">
🏠 ساخت اتاق
</button>

<button class="secondary" onclick="showJoin()">
🔑 ورود به اتاق
</button>

</div>


<!-- ورود -->
<div id="join" class="hidden">

<h1>ورود به اتاق</h1>

<input id="joinName" placeholder="نام بازیکن">

<input id="roomInput" placeholder="کد اتاق">

<button onclick="joinRoom()">
ورود
</button>

<button class="secondary" onclick="goHome()">
برگشت
</button>

</div>


<!-- اتاق -->
<div id="room" class="hidden">

<h1>🎴 میز حکم</h1>

<div>کد اتاق:</div>

<div class="room-code" id="roomCode"></div>

<button onclick="copyRoom()">
📋 کپی کد
</button>

<h3>بازیکنان</h3>

<div id="players"></div>

<div class="status" id="status">
منتظر بازیکنان...
</div>

<button id="startButton"
onclick="startGame()"
class="hidden">
🎴 شروع بازی
</button>

</div>


<!-- بازی -->
<div id="game" class="hidden">

<h1>🎴 بازی حکم</h1>

<div id="gameStatus" class="status"></div>

<div id="playersGame"></div>

<h3>کارت‌های من</h3>

<div id="myCards" class="cards"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  onSnapshot,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {

apiKey:"AIzaSyDtRaFMcVr142yxGzvKxwmVCqA31xlIc_8",

authDomain:"hokm-online-a0d29.firebaseapp.com",

projectId:"hokm-online-a0d29",

storageBucket:"hokm-online-a0d29.firebasestorage.app",

messagingSenderId:"141416145029",

appId:"1:141416145029:web:40a3593c1c4d9ae93e89ec"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* اطلاعات بازیکن */

let roomCode="";
let playerName="";
let playerId="";

let unsubscribe=null;


/* شناسه مخصوص همین دستگاه */

function getPlayerId(){

let id=localStorage.getItem("hokmPlayerId");

if(!id){

id=
Date.now().toString(36)+
Math.random().toString(36).substring(2,8);

localStorage.setItem("hokmPlayerId",id);

}

return id;

}

playerId=getPlayerId();


/* ساخت اتاق */

window.createRoom=async function(){

playerName=
document.getElementById("name").value.trim();

if(!playerName){

alert("نام خودت را وارد کن");

return;

}


roomCode=
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();


const roomRef=
doc(db,"rooms",roomCode);


await setDoc(roomRef,{

hostId:playerId,

status:"waiting",

players:[{

id:playerId,

name:playerName

}],

createdAt:Date.now()

});


openRoom();

listenRoom();

};


/* ورود به اتاق */

window.joinRoom=async function(){

playerName=
document.getElementById("joinName")
.value.trim();

roomCode=
document.getElementById("roomInput")
.value.trim()
.toUpperCase();


if(!playerName || !roomCode){

alert("نام و کد اتاق را وارد کن");

return;

}


const roomRef=
doc(db,"rooms",roomCode);


try{

await runTransaction(db,async(transaction)=>{

const snap=
await transaction.get(roomRef);

if(!snap.exists()){

throw new Error("NO_ROOM");

}

const data=snap.data();

const players=data.players || [];


if(players.length>=4){

throw new Error("FULL");

}


if(data.status==="playing"){

throw new Error("STARTED");

}


players.push({

id:playerId,

name:playerName

});


transaction.update(roomRef,{

players:players

});

});


openRoom();

listenRoom();


}catch(error){

if(error.message==="FULL"){

alert("این اتاق ۴ بازیکن دارد");

}else if(error.message==="STARTED"){

alert("بازی شروع شده است");

}else{

alert("اتاق پیدا نشد");

}

}

};


/* نمایش اتاق */

function openRoom(){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("join")
.classList.add("hidden");

document
.getElementById("room")
.classList.remove("hidden");

document
.getElementById("roomCode")
.innerText=roomCode;

}


/* گوش دادن به اتاق */

function listenRoom(){

const roomRef=
doc(db,"rooms",roomCode);


unsubscribe=
onSnapshot(roomRef,(snap)=>{

if(!snap.exists()){

return;

}


const data=snap.data();

const players=data.players || [];


const box=
document.getElementById("players");

box.innerHTML="";


players.forEach((p,index)=>{

const div=
document.createElement("div");

div.className="player";

div.innerText=
(index===0?"👑 ":"👤 ")+p.name;

box.appendChild(div);

});


document.getElementById("status").innerText=
players.length+"/4 بازیکن";


if(
players.length===4 &&
data.hostId===playerId &&
data.status==="waiting"
){

document
.getElementById("startButton")
.classList.remove("hidden");

}else{

document
.getElementById("startButton")
.classList.add("hidden");

}


if(data.status==="playing"){

showGame(data);

}

});

}


/* ساخت دسته کارت */

function createDeck(){

const suits=[

{symbol:"♠",name:"spades",red:false},

{symbol:"♥",name:"hearts",red:true},

{symbol:"♦",name:"diamonds",red:true},

{symbol:"♣",name:"clubs",red:false}

];

const values=[

"A","K","Q","J","10","9","8","7","6","5","4","3","2"

];


let deck=[];


for(const suit of suits){

for(const value of values){

deck.push({

suit:suit.symbol,

value:value,

red:suit.red

});

}

}


return deck;

}


/* بُر زدن */

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=
Math.floor(Math.random()*(i+1));

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}


/* شروع بازی */

window.startGame=async function(){

const roomRef=
doc(db,"rooms",roomCode);


const snap=
await getDoc(roomRef);


if(!snap.exists()){

alert("اتاق پیدا نشد");

return;

}


const data=snap.data();

const players=data.players || [];


if(players.length!==4){

alert("برای شروع دقیقاً ۴ بازیکن لازم است");

return;

}


let deck=shuffle(createDeck());


let hands={};


players.forEach((player,index)=>{

hands[player.id]=
deck.slice(index*5,index*5+5);

});


await updateDoc(roomRef,{

status:"playing",

hands:hands,

deck:deck.slice(20),

turn:0,

startedAt:Date.now()

});

};


/* نمایش بازی */

function showGame(data){

document
.getElementById("room")
.classList.add("hidden");

document
.getElementById("game")
.classList.remove("hidden");


const players=data.players || [];


const box=
document.getElementById("playersGame");

box.innerHTML="";


players.forEach((p,index)=>{

const div=
document.createElement("div");

div.className="player";

div.innerText=
(index===0?"👑 ":"👤 ")+p.name;

box.appendChild(div);

});


const myHand=
(data.hands && data.hands[playerId])
? data.hands[playerId]
:[];


const cards=
document.getElementById("myCards");

cards.innerHTML="";


myHand.forEach(card=>{

const div=
document.createElement("div");

div.className="card";

if(card.red){

div.classList.add("red");

}

div.innerHTML=
"<div>"+card.value+"</div>"+
"<div>"+card.suit+"</div>";

cards.appendChild(div);

});


document
.getElementById("gameStatus")
.innerText=
"۵ کارت اول پخش شد 🎴";

}


/* کپی */

window.copyRoom=function(){

navigator.clipboard
.writeText(roomCode);

alert("کد اتاق کپی شد ✅");

};


/* ورود */

window.showJoin=function(){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("join")
.classList.remove("hidden");

};


/* برگشت */

window.goHome=function(){

document
.getElementById("join")
.classList.add("hidden");

document
.getElementById("home")
.classList.remove("hidden");

};

</script>

</body>
</html>
